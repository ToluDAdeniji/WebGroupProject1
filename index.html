<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Broomstick Ride - Haunted Harvest</title>
    <!-- Link to the required external stylesheet -->
    <link rel="stylesheet" href="haunted-harvest.css">
</head>
<body>

    <!-- Main content area -->
    <main class="scenes">
        <!-- Main Animation Scene for Option 5 (Default view) -->
        <section id="ride" class="scene">
            <div class="animation-stage">

                <!-- Replace the src with the path to your image files in your assets folder -->
                <div class="clouds">
                    <img src="assets/images/clouds.png" alt="Drifting clouds">
                </div>
                
                <div class="trees">
                    <img src="assets/images/trees.png" alt="Spooky trees">
                </div>
                
                <div class="owls">
                    <img src="assets/images/owl.png" alt="Flying owl">
                </div>
                
                <div class="witch-container">
                    <img src="assets/images/witch-broom.png" alt="Witch riding a broomstick" class="witch">
                    <img src="assets/images/sparks.png" alt="Broomstick sparks trail" class="sparks">
                </div>
                
                <div class="hay-wagon">
                    <img src="assets/images/hay-wagon.png" alt="Couple waving inside a hay wagon">
                </div>

            </div>
        </section>
    </main>

</body>
</html>
