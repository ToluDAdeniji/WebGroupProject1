<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Broomstick Ride - Haunted Harvest</title>
    <!-- Link to the required external stylesheet -->
    <link rel="stylesheet" href="haunted-harvest.css">
</head>
<body>

    <!-- Main content area -->
    <main class="scenes">
        <!-- Main Animation Scene for Option 5 (Default view) -->
        <section id="ride" class="scene">
            <div class="animation-stage">
                <!-- Option 5 required moving elements -->
                <div class="clouds"></div>
                <div class="trees"></div>
                <div class="owls">🦉</div>
                <div class="witch-container">
                    <span class="witch">🧙‍♀️🧹</span>
                    <span class="sparks">✨</span>
                </div>
                <div class="hay-wagon">🛒</div>
            </div>
        </section>

    </main>

</body>
</html>
